name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mikoto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go for mikoto
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install mikoto
        run: go install github.com/ieee0824/mikoto/cmd/mikoto@v0.0.0-20261001040934-03380e477fe4

      - name: Download project dependencies
        run: go mod download

      - name: Check function length and purity
        run: |
          MIKOTO_BIN="$(go env GOPATH)/bin/mikoto" bash scripts/check-mikoto.sh

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Test
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
